name: FLGODTV CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # Windows Build & Test Job
  # --------------------------------------------------------------------------
  build-windows:
    name: Windows x64 MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK via Chocolatey
        shell: powershell
        run: |
          choco install vulkan-sdk -y --no-progress
          $vks = Get-ChildItem -Path "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vks) {
            Write-Host "Found Vulkan SDK at $($vks.FullName)"
            "VULKAN_SDK=$($vks.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "$($vks.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Configure CMake (Visual Studio 2022)
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFLGOD_ENABLE_VULKAN=ON

      - name: Compile flgod & Test Suite
        run: |
          cmake --build build --config Release --parallel

      - name: Execute CTest Suite (GEMINI.md Section 103 Compliant)
        run: |
          echo "[INFO] Running all CPU, Physics, Learning, Evolution, Agent, Language, Tech, and Brain tests..."
          echo "[INFO] Per GEMINI.md Section 103, physical GPU Vulkan execution requires dedicated hardware:"
          echo "[INFO] VULKAN GPU TEST = NOT AVAILABLE (Cloud runner has no physical Vulkan GPU device)"
          ctest --test-dir build -C Release --output-on-failure -E "(VulkanInitTest|VulkanBufferTest|VulkanComputeTest|GodotFrontendSmokeTest)"

      - name: Verify Headless CLI Modes
        run: |
          .\build\Release\flgod.exe --version
          .\build\Release\flgod.exe --self-test
          .\build\Release\flgod.exe --validate
          .\build\Release\flgod.exe --simulate 120

      - name: Upload Windows Binaries & Artifacts (Section 104)
        uses: actions/upload-artifact@v4
        with:
          name: flgodtv-windows-x64
          path: |
            build/Release/flgod.exe
            evidence/
            docs/

  # --------------------------------------------------------------------------
  # Linux Build & Test Job
  # --------------------------------------------------------------------------
  build-linux:
    name: Linux x64 GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libvulkan-dev vulkan-tools glslc

      - name: Configure CMake (Ninja Release)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DFLGOD_ENABLE_VULKAN=ON

      - name: Compile flgod & Test Suite
        run: |
          cmake --build build --config Release --parallel

      - name: Execute CTest Suite (GEMINI.md Section 103 Compliant)
        run: |
          echo "[INFO] Running all CPU, Physics, Learning, Evolution, Agent, Language, Tech, and Brain tests..."
          echo "[INFO] Per GEMINI.md Section 103, physical GPU Vulkan execution requires dedicated hardware:"
          echo "[INFO] VULKAN GPU TEST = NOT AVAILABLE (Cloud runner has no physical Vulkan GPU device)"
          ctest --test-dir build --output-on-failure -E "(VulkanInitTest|VulkanBufferTest|VulkanComputeTest|GodotFrontendSmokeTest)"

      - name: Verify Headless CLI Modes
        run: |
          ./build/flgod --version
          ./build/flgod --self-test
          ./build/flgod --validate
          ./build/flgod --simulate 120

      - name: Upload Linux Binaries & Artifacts (Section 104)
        uses: actions/upload-artifact@v4
        with:
          name: flgodtv-linux-x64
          path: |
            build/flgod
            evidence/
            docs/
