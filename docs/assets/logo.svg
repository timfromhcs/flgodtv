<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111927"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Technical Grid Overlay -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="1">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- 4-Camera Broadcast Frame Borders -->
  <rect x="72" y="72" width="368" height="368" rx="20" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="256" y1="72" x2="256" y2="440" stroke="#1e293b" stroke-width="2"/>
  <line x1="72" y1="256" x2="440" y2="256" stroke="#1e293b" stroke-width="2"/>

  <!-- Telemetry Camera Markers -->
  <text x="86" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CAM 1 [GOD FLY]</text>
  <text x="270" y="96" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CAM 2 [LEARNER]</text>
  <text x="86" y="278" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CAM 3 [EVENT]</text>
  <text x="270" y="278" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CAM 4 [COLONY]</text>

  <!-- Connectome Neural Synapses -->
  <g stroke="#00f0ff" stroke-width="1.8" opacity="0.65" filter="url(#glow)">
    <!-- Central Thorax & Cephalic Ganglion -->
    <line x1="256" y1="170" x2="220" y2="210"/>
    <line x1="256" y1="170" x2="292" y2="210"/>
    <line x1="220" y1="210" x2="256" y2="256"/>
    <line x1="292" y1="210" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="256" y2="330"/>
    
    <!-- Left Wing Connectome -->
    <line x1="220" y1="210" x2="150" y2="180"/>
    <line x1="150" y1="180" x2="110" y2="220"/>
    <line x1="110" y1="220" x2="160" y2="270"/>
    <line x1="160" y1="270" x2="220" y2="256"/>
    <line x1="150" y1="180" x2="160" y2="270"/>

    <!-- Right Wing Connectome -->
    <line x1="292" y1="210" x2="362" y2="180"/>
    <line x1="362" y1="180" x2="402" y2="220"/>
    <line x1="402" y1="220" x2="352" y2="270"/>
    <line x1="352" y1="270" x2="292" y2="256"/>
    <line x1="362" y1="180" x2="352" y2="270"/>

    <!-- Abdomen & Motor Nerve Cord -->
    <line x1="256" y1="330" x2="230" y2="380"/>
    <line x1="256" y1="330" x2="282" y2="380"/>
    <line x1="230" y1="380" x2="256" y2="410"/>
    <line x1="282" y1="380" x2="256" y2="410"/>
  </g>

  <!-- Connectome Neural Somas (Nodes) -->
  <g fill="#ffffff" filter="url(#glow)">
    <!-- Cephalic Core -->
    <circle cx="256" cy="170" r="7" fill="#00f0ff"/>
    <circle cx="220" cy="210" r="5" fill="#7000ff"/>
    <circle cx="292" cy="210" r="5" fill="#7000ff"/>
    <circle cx="256" cy="256" r="8" fill="#00f0ff"/>

    <!-- Left Wing Ganglia -->
    <circle cx="150" cy="180" r="4.5" fill="#00f0ff"/>
    <circle cx="110" cy="220" r="4" fill="#38bdf8"/>
    <circle cx="160" cy="270" r="5" fill="#7000ff"/>
    <circle cx="220" cy="256" r="4" fill="#38bdf8"/>

    <!-- Right Wing Ganglia -->
    <circle cx="362" cy="180" r="4.5" fill="#00f0ff"/>
    <circle cx="402" cy="220" r="4" fill="#38bdf8"/>
    <circle cx="352" cy="270" r="5" fill="#7000ff"/>
    <circle cx="292" cy="256" r="4" fill="#38bdf8"/>

    <!-- Somatic Abdomen -->
    <circle cx="256" cy="330" r="6" fill="#ff0055"/>
    <circle cx="230" cy="380" r="4" fill="#ffaa00"/>
    <circle cx="282" cy="380" r="4" fill="#ffaa00"/>
    <circle cx="256" cy="410" r="5" fill="#ff0055"/>

    <!-- Compound Eyes (Sensory Inputs) -->
    <circle cx="242" cy="150" r="4" fill="#ffaa00"/>
    <circle cx="270" cy="150" r="4" fill="#ffaa00"/>
  </g>

  <!-- Central Core Hexagon / Reticle -->
  <polygon points="256,130 290,150 290,190 256,210 222,190 222,150" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Bottom Brand Mark -->
  <text x="256" y="475" text-anchor="middle" fill="#f8fafc" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="20" font-weight="800" letter-spacing="6">FLGODTV</text>
</svg>
