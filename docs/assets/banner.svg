<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a10"/>
      <stop offset="50%" stop-color="#0c121e"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bannerBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Technical Grid -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Left: Stylized Connectome Rig -->
  <g transform="translate(60, 20)">
    <!-- 4-Camera Scope Box -->
    <rect x="0" y="40" width="240" height="240" rx="16" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="120" y1="40" x2="120" y2="280" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="0" y1="160" x2="240" y2="160" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="12" y="62" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CAM 1 [GOD FLY]</text>
    <text x="132" y="62" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CAM 2 [AGENT]</text>
    <text x="12" y="182" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CAM 3 [EVENT]</text>
    <text x="132" y="182" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CAM 4 [COLONY]</text>

    <!-- Connectome Lattice -->
    <g stroke="#00f0ff" stroke-width="1.6" opacity="0.6" filter="url(#bannerGlow)">
      <line x1="120" y1="95" x2="95" y2="130"/>
      <line x1="120" y1="95" x2="145" y2="130"/>
      <line x1="95" y1="130" x2="120" y2="160"/>
      <line x1="145" y1="130" x2="120" y2="160"/>
      <line x1="120" y1="160" x2="120" y2="210"/>
      <!-- Wings -->
      <line x1="95" y1="130" x2="50" y2="110"/>
      <line x1="50" y1="110" x2="25" y2="140"/>
      <line x1="25" y1="140" x2="60" y2="175"/>
      <line x1="60" y1="175" x2="95" y2="160"/>
      
      <line x1="145" y1="130" x2="190" y2="110"/>
      <line x1="190" y1="110" x2="215" y2="140"/>
      <line x1="215" y1="140" x2="180" y2="175"/>
      <line x1="180" y1="175" x2="145" y2="160"/>
      <!-- Abdomen -->
      <line x1="120" y1="210" x2="100" y2="245"/>
      <line x1="120" y1="210" x2="140" y2="245"/>
      <line x1="100" y1="245" x2="120" y2="265"/>
      <line x1="140" y1="245" x2="120" y2="265"/>
    </g>

    <g fill="#ffffff" filter="url(#bannerGlow)">
      <circle cx="120" cy="95" r="5" fill="#00f0ff"/>
      <circle cx="95" cy="130" r="4" fill="#a855f7"/>
      <circle cx="145" cy="130" r="4" fill="#a855f7"/>
      <circle cx="120" cy="160" r="6" fill="#00f0ff"/>
      <circle cx="50" cy="110" r="3.5" fill="#38bdf8"/>
      <circle cx="190" cy="110" r="3.5" fill="#38bdf8"/>
      <circle cx="25" cy="140" r="3" fill="#38bdf8"/>
      <circle cx="215" cy="140" r="3" fill="#38bdf8"/>
      <circle cx="120" cy="210" r="4.5" fill="#f43f5e"/>
      <circle cx="100" cy="245" r="3" fill="#fbbf24"/>
      <circle cx="140" cy="245" r="3" fill="#fbbf24"/>
      <circle cx="120" cy="265" r="3.5" fill="#f43f5e"/>
    </g>
  </g>

  <!-- Right: Title, Subtitle, Specifications -->
  <g transform="translate(360, 45)">
    <!-- Badges / System Chips -->
    <rect x="0" y="25" width="105" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="52" y="40" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C++20 CORE</text>

    <rect x="115" y="25" width="130" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="180" y="40" text-anchor="middle" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">VULKAN COMPUTE</text>

    <rect x="255" y="25" width="125" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="317" y="40" text-anchor="middle" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">GODOT 4 FORWARD+</text>

    <rect x="390" y="25" width="145" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="462" y="40" text-anchor="middle" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">CONNECTOME ADAPTER</text>

    <!-- Project Title -->
    <text x="0" y="110" fill="url(#textGrad)" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="52" font-weight="900" letter-spacing="4">FLGODTV</text>

    <!-- Subtitle -->
    <text x="0" y="145" fill="#94a3b8" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="16" font-weight="500">
      Deterministic Multi-Agent Evolution &amp; Biological Connectome Simulation Platform
    </text>

    <!-- Technical Metrics Ticker -->
    <g transform="translate(0, 185)">
      <line x1="0" y1="0" x2="780" y2="0" stroke="#1e293b" stroke-width="1"/>

      <text x="0" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">SOMA INTEGRATION:</text>
      <text x="150" y="30" fill="#00f0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">128.95M / sec</text>

      <text x="280" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">MULTI-AGENT SIM:</text>
      <text x="415" y="30" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">9,418 ticks/s (157x)</text>

      <text x="595" y="30" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">TESTS:</text>
      <text x="645" y="30" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">49/49 PASSED (100%)</text>
    </g>
  </g>
</svg>
